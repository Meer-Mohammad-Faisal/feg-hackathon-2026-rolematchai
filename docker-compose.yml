version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: sessioniq-postgres
    environment:
      POSTGRES_DB: sessioniq
      POSTGRES_USER: sessioniq
      POSTGRES_PASSWORD: sessioniq_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001_initial.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sessioniq"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sessioniq-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: sessioniq-backend
    environment:
      DATABASE_URL: postgresql://sessioniq:sessioniq_password@postgres:5432/sessioniq
      REDIS_URL: redis://redis:6379
      BACKEND_PORT: 4000
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/server.js"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: sessioniq-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
